name: Generate typing animation candidate

on:
  workflow_dispatch:
  push:
    paths:
      - 'Scripts/build_typing_candidate.py'
      - '.github/workflows/typing-candidate.yml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.1.0 opencv-python-headless==4.10.0.84 'numpy<2'
      - name: Render 20 candidate frames from original illustration
        run: python Scripts/build_typing_candidate.py
      - name: Validate all 20 frames
        run: python Scripts/validate_companion_frames.py Artwork/Candidates/Typing.atlas
      - name: Generate contact sheet and movement heatmap
        run: python Scripts/audit_companion_art.py Artwork/Candidates/Typing.atlas --output Artwork/Candidates/audit
      - name: Upload playable preview and PNG pack
        uses: actions/upload-artifact@v4
        with:
          name: typing-candidate-20-frames
          path: Artwork/Candidates/
          retention-days: 30

      - name: Publish review-only frames to a dedicated branch
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B companion-typing-preview
          git add -f Artwork/Candidates/Typing.atlas/ Artwork/Candidates/typing_preview.gif Artwork/Candidates/audit/
          if git diff --cached --quiet; then
            echo "Candidate artifacts unchanged"
          else
            git commit -m "Render review-only typing candidate frames (not shipped)"
          fi
          git push origin HEAD:refs/heads/companion-typing-preview --force
          echo "Preview: https://github.com/${{ github.repository }}/blob/companion-typing-preview/Artwork/Candidates/typing_preview.gif" >> "$GITHUB_STEP_SUMMARY"

      - name: Install regenerated frames into the iOS atlas
        if: success() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          # Keep generated files outside the working tree while switching back
          # from the preview branch. Never force-push the production branch.
          mkdir -p /tmp/queue-typing-atlas
          cp Artwork/Candidates/Typing.atlas/typing_*.png /tmp/queue-typing-atlas/
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p Queue/Resources/Atlases/Typing.atlas
          cp /tmp/queue-typing-atlas/typing_*.png Queue/Resources/Atlases/Typing.atlas/
          python Scripts/validate_companion_frames.py Queue/Resources/Atlases/Typing.atlas
          git add Queue/Resources/Atlases/Typing.atlas/typing_*.png
          if git diff --cached --quiet; then
            echo "Shipping frames already match regenerated frames"
          else
            git commit -m "Regenerate 20 typing frames with rigid laptop geometry"
            git push origin HEAD:refs/heads/main
          fi
