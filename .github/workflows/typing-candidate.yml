name: Generate typing animation candidate

on:
  workflow_dispatch:
  push:
    paths:
      - 'Scripts/build_typing_candidate.py'
      - '.github/workflows/typing-candidate.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.1.0 opencv-python-headless==4.10.0.84 'numpy<2'
      - name: Render 20 candidate frames from original illustration
        run: python Scripts/build_typing_candidate.py
      - name: Validate all 20 frames
        run: python Scripts/validate_companion_frames.py Artwork/Candidates/Typing.atlas
      - name: Generate contact sheet and movement heatmap
        run: python Scripts/audit_companion_art.py Artwork/Candidates/Typing.atlas --output Artwork/Candidates/audit
      - name: Upload playable preview and PNG pack
        uses: actions/upload-artifact@v4
        with:
          name: typing-candidate-20-frames
          path: Artwork/Candidates/
          retention-days: 30
