name: Queue
options:
  bundleIdPrefix: com.queueapp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: "0.1.2"
packages:
  QueueCore:
    path: .
targets:
  Queue:
    type: application
    platform: iOS
    sources:
      - path: Queue
      - path: Shared
    resources:
      - path: Queue/Resources/Assets.xcassets
      - path: Queue/Resources/Atlases/Working.atlas
      - path: Queue/Resources/Atlases/Typing.atlas
      - path: Queue/Resources/Atlases/DeepFocus.atlas
      - path: Queue/Resources/Atlases/Completed.atlas
      - path: Queue/Resources/Atlases/Expired.atlas
    entitlements:
      path: Queue/Resources/Queue.entitlements
    dependencies:
      - package: QueueCore
        product: QueueCore
      - target: QueueWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.queueapp.Queueup
        INFOPLIST_FILE: Queue/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Queue/Resources/Queue.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 2YJ478267N
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
    info:
      path: Queue/Resources/Info.plist
      properties:
        CFBundleDisplayName: Queue
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: com.queueapp.Queueup
            CFBundleURLSchemes:
              - queueapp
        NSCalendarsFullAccessUsageDescription: Queue shows your meetings so it can suggest tasks that fit in open gaps. Events are read only and stay on your device.
        NSCalendarsUsageDescription: Queue shows your meetings so it can suggest tasks that fit in open gaps. Events are read only and stay on your device.
  QueueWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: QueueWidgets
      - path: Shared
      - path: Queue/Core/Persistence
      - path: Queue/Core/Focus
      - path: Queue/App/AppModelContainer.swift
    entitlements:
      path: QueueWidgets/QueueWidgets.entitlements
    dependencies:
      - package: QueueCore
        product: QueueCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.queueapp.Queueup.widgets
        INFOPLIST_FILE: QueueWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: QueueWidgets/QueueWidgets.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        DEVELOPMENT_TEAM: 2YJ478267N
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: true
    info:
      path: QueueWidgets/Info.plist
      properties:
        CFBundleDisplayName: Queue
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  QueueTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QueueTests
    dependencies:
      - target: Queue
      - package: QueueCore
        product: QueueCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.queueapp.QueueupTests
        GENERATE_INFOPLIST_FILE: true
schemes:
  Queue:
    build:
      targets:
        Queue: all
        QueueWidgets: all
        QueueTests: [test]
    test:
      targets:
        - QueueTests
    run:
      config: Debug
